# ============================================================
#  EM4 Revive – Konfiguration
#  Jede Option ist einzeln abschaltbar. Änderungen wirken beim
#  nächsten Spielstart. Fehlt diese Datei, wird sie neu erzeugt.
# ============================================================

[general]
# Hauptschalter. false = die Mod tut nichts (nur DirectInput wird durchgereicht).
enabled = true
# Ausführlicheres Log (em4revive.log) zur Fehlersuche.
debug_log = false

[game]
# Sixteen-Tons-Logo, 1 Sekunde Pause und Intro-Video beim Start überspringen.
# (Nur im Arbeitsspeicher – Em4.exe auf der Festplatte bleibt unverändert.)
skip_intro = true
# logfile.txt geöffnet halten statt für jede Zeile neu zu öffnen (schnelleres Laden,
# weniger Ruckler bei Mods mit viel Log-Ausgabe). Jede Zeile wird trotzdem sofort gespeichert.
fast_logfile = true
# Beim Beenden die Einstellungen speichern und das Spiel sofort schließen, statt das
# fehlerhafte Aufräumen der Engine laufen zu lassen (das stürzt mit vielen Mods ab).
fast_exit = true

[window]
# Randloses Vollbild: keine Auflösungsumschaltung, kein Minimieren -> Alt+Tab geht sofort,
# Screenshots (Druck, Win+Umschalt+S) funktionieren. Greift nur, wenn die Spielauflösung
# der Desktop-Auflösung entspricht; sonst bleibt das alte exklusive Vollbild.
borderless = true
# Im Hintergrund pausieren wie das Original (true). false = Spiel läuft weiter, während ein
# anderes Fenster aktiv ist.
pause_in_background = false
# Das Spiel meldet Windows sonst "Bildschirmschoner läuft" und sperrt damit
# Druck-Taste und Windows-Tastenkürzel.
allow_system_keys = true

[perf]
# Windows-Timer auf 1 ms stellen (genaueres Timing, weniger Mikroruckler).
high_res_timer = true
# FPS-Limit. 0 = aus. Beispiel: 60, 120, 144.
frame_limit = 0
# VSync: -1 = Spiel entscheidet, 0 = aus, 1 = an.
vsync = -1
# Windows-Skalierung (z.B. 125 %) nicht auf das Spiel anwenden.
dpi_aware = true
# Merkt sich Dateien, die das Spiel vergeblich gesucht hat, und beantwortet weitere
# Suchen danach sofort (das Spiel sucht dieselben fehlenden Dateien zehntausendfach).
missing_file_cache = true
# Schnelleres Entpacken von Modellen, PNG-Texturen und ZIP-Dateien beim Laden
# (ersetzt die eingebaute zlib von 2003 durch eine moderne Implementierung).
fast_zlib = true

[stats]
# Misst FPS, Frametimes, Draw-Calls und RAM.
enabled = true
# Schreibt die Messwerte als Tabelle nach em4revive_stats.csv.
csv = true
# Messintervall in Sekunden.
interval_sec = 1.0

[gl]
# Tiefenpuffer erzwingen (Bits). Das Spiel fordert nur 16 an -> Flackern auf Distanz.
# 0 = nicht verändern, sonst 24 oder 32.
force_depth_bits = 24
# Stencil-Puffer (Bits). 0 = nicht verändern, sonst 8.
force_stencil_bits = 8
# Kantenglättung (MSAA): 0 = aus, 2, 4 oder 8 Samples. Glättet Kanten von Fahrzeugen,
# Gebäuden und Leitungen. Fällt automatisch auf weniger Samples zurück, wenn nötig.
msaa = 4
# Anisotrope Texturfilterung (schärfere Böden/Straßen). 0 = nicht verändern, sonst 2/4/8/16.
anisotropy = 16
# Bilinear-Mipmapping zu Trilinear aufwerten (weichere Übergänge zwischen Mip-Stufen).
force_trilinear = true
# Draw-Calls zählen (für die Statistik, sehr geringer Aufwand).
count_draw_calls = true

[fx]
# Eigene Grafik-Effekte (nur auf die 3D-Welt, Menüs und Anzeigen bleiben unverändert).
enabled = false
# Diagnose: einmal ein Vergleichsbild vorher/nachher speichern (em4revive_fx_*.bmp).
capture = false
# Nachschärfen (CAS): 0 = aus, bis 1 = stark.
sharpen = 0.5
# Kontrast: 1 = unverändert.
contrast = 1.06
# Farbsättigung: 1 = unverändert.
saturation = 1.10
# Lebendigkeit (hebt blasse Farben stärker an als kräftige): 0 = unverändert.
vibrance = 0.15
# Farbtemperatur: 0 = neutral, positiv = wärmer, negativ = kühler.
warmth = 0.10
# Filmische Kontrastkurve (weiche Lichter und Schatten): 0 = aus, 1 = stark.
filmic = 0.25
# Umgebungsverdeckung (SSAO): weiche Schatten in Ecken, unter Fahrzeugen, an Wänden.
ssao = true
# Stärke: 0 = aus, 1 = normal, 2 = kräftig.
ssao_strength = 1.0
# Wirkradius in Spieleinheiten (größer = weichere, weitere Schatten).
ssao_radius = 60.0
# Tiefenunschärfe: weit entfernte Bereiche werden weicher.
dof = true
# Stärke: 0 = aus, 1 = stark.
dof_strength = 0.5
# Ab dieser Entfernung beginnt die Unschärfe, bei dof_end ist sie voll.
dof_start = 9000.0
dof_end = 22000.0

[crash]
# Bei einem Absturz eine Minidump-Datei (em4revive_crash_*.dmp) schreiben.
minidump = true

[profiler]
# Analyse, wo das Spiel Zeit verbraucht (CPU-Stichproben + Dateizugriffe).
# Ergebnis: em4revive_profile.txt. Kostet etwas Leistung -> nur zum Messen einschalten.
enabled = false
# Stichproben pro Sekunde (100-2000).
sample_hz = 1000
# Dateizugriffe mitmessen (Anzahl, fehlende Dateien, Lesezeit).
file_io = true
# Bericht alle X Sekunden aktualisieren.
report_interval_sec = 15
# Entwickler-Diagnose: ein einzelnes Bild im Spiel Aufruf für Aufruf aufzeichnen
# (em4revive_frametrace.txt). Unabhängig vom Profiler.
frame_trace = false

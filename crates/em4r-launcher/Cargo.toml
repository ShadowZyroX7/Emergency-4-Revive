[package]
name = "em4r-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EM4 Revive Launcher – Mod auswählen und direkt spielen"

[[bin]]
name = "EM4Revive"
path = "src/main.rs"

[dependencies]
em4r-core.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit = "0.22"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

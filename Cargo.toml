[workspace]
resolver = "2"
members = [
    "crates/em4r-core",
    "crates/em4r-gl",
    "crates/em4r-fx",
    "crates/em4r-zlib",
    "crates/em4r-perf",
    "crates/em4r-prof",
    "crates/em4r-window",
    "crates/em4r-proxy",
    "crates/em4r-smoke",
    "crates/em4r-launcher",
    "crates/em4r-setup",
    "crates/em4r-re",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["a.mallwitz"]

[workspace.dependencies]
em4r-core = { path = "crates/em4r-core" }
em4r-gl = { path = "crates/em4r-gl" }
em4r-fx = { path = "crates/em4r-fx" }
em4r-zlib = { path = "crates/em4r-zlib" }
em4r-perf = { path = "crates/em4r-perf" }
em4r-prof = { path = "crates/em4r-prof" }
em4r-window = { path = "crates/em4r-window" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"   # PDB with line info for reading crash dumps
